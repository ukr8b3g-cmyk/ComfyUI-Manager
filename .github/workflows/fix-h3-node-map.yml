name: Fix H3 Continuum node map

on:
  push:
    branches:
      - fix/h3-continuum-node-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h3-continuum-node-map
          fetch-depth: 0

      - name: Replace only the H3 Continuum mapping
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          files = [
              Path('extension-node-map.json'),
              Path('node_db/new/extension-node-map.json'),
          ]
          repo = 'https://github.com/ukr8b3g-cmyk/ComfyUI-H3-Continuum'
          replacement = '''    "https://github.com/ukr8b3g-cmyk/ComfyUI-H3-Continuum": [
                  [
                      "H3ContinuumSamplerV38",
                      "H3ContinuumReferenceAudios",
                      "H3ContinuumAssembleSeamV35",
                      "H3EasyLoadImage",
                      "H3EasyLoadAudio",
                      "H3ContinuumLoadVideo",
                      "H3ContinuumSecondPassV35"
                  ],
                  {
                      "title_aux": "H3 Continuum"
                  }
              ],'''
          pattern = re.compile(
              r'^    "' + re.escape(repo) + r'": \[\s*'
              r'\[\s*.*?\s*\],\s*'
              r'\{\s*"title_aux": "H3 Continuum"\s*\}\s*'
              r'\],',
              re.MULTILINE | re.DOTALL,
          )

          for path in files:
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one H3 Continuum entry, found {count}')
              json.loads(new_text)
              if new_text.startswith('\ufeff'):
                  raise SystemExit(f'{path}: unexpected UTF-8 BOM')
              path.write_text(new_text, encoding='utf-8', newline='\n')

      - name: Validate minimal diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'extension-node-map.json\nnode_db/new/extension-node-map.json'
          test "$changed" = "$expected"
          python -m json.tool extension-node-map.json >/dev/null
          python -m json.tool node_db/new/extension-node-map.json >/dev/null
          ! grep -A60 'ukr8b3g-cmyk/ComfyUI-H3-Continuum' extension-node-map.json | grep -q 'VAEDecodeAudio'
          ! grep -A60 'ukr8b3g-cmyk/ComfyUI-H3-Continuum' node_db/new/extension-node-map.json | grep -q 'VAEDecodeAudio'

      - name: Commit final two-file fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-h3-node-map.yml
          git add extension-node-map.json node_db/new/extension-node-map.json
          git commit -m "fix(node-map): correct H3 Continuum public nodes"
          git push origin HEAD:fix/h3-continuum-node-map
